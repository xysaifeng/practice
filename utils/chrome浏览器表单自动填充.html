<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    label {
      display: block;
      margin-top: 1rem;
    }
  </style>
</head>

<body>
  <form>
    <label for="firstName">First Name:</label>
    <input name="firstName" id="firstName" type="text" autocomplete="section-a first-name" />

    <label for="lastName">Last Name:</label>
    <input name="lastName" id="lastName" type="text" autocomplete="on" />

    <label for="email">Email:</label>
    <input name="email" id="email" type="email" autocomplete="on" />
  </form>
</body>

</html>
