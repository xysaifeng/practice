<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>

    class TaskPro {
      _tasks = []

      addTask(task) {
        this._tasks.push(task)
      }

      run() {
        // this._tasks[0]()

        if (this._tasks.length === 0) return
        const task = this._tasks.shift()
        return task(() => {
          return this.run()
        })
      }

    }



    const t = new TaskPro()

    t.addTask(async (next) => {
      console.log(1, '---start');
      await next()
      console.log(1, '---end');
    })
    t.addTask(async (next) => {
      console.log(2, '---start');
      await next()
      console.log(2, '---end');
    })
    t.addTask(async (next) => {
      console.log(3, '---start');
      await next()
      console.log(3, '---end');
    })

    t.run() // 1 start ,2,3,1 end

  </script>
</body>

</html>
