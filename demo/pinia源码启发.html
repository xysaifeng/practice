    const pinia = {}

    setupFn('user', pinia)

      function setup() {

        return Object.assign(store, {

      }
      createSetupContext(id, setup)

    function createSetupContext(id, setup) {
      const store = { a: 1 }
      pinia[id] = store
      const setupStore = (() => setup())()
      console.log('setupStore: ', setupStore);

    }
  </script>
