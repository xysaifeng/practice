<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    html,
    body {
      height: 100%;
    }

    /* html,
    body,
    svg {
      height: 100%;
    } */

    svg {
      background-color: aqua;
    }

    rect {
      stroke: red;
      stroke-width: 3;
      /* fill: none */
    }
  </style>
  <link rel="stylesheet" href="index.css">

</head>



<body>
  <!-- <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="100%" height="100%" />
    <circle cx="50%" cy="50%" r="4" fill="white" />
  </svg>
  <svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="100%" height="100%" />
    <circle cx="50%" cy="50%" r="5" fill="white" />
  </svg>
  <svg viewBox="-5 -5 10 10" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="100%" height="100%" />
    <circle cx="50%" cy="50%" r="4" fill="white" />
  </svg> -->

  <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" version="1.1">
    <defs>
      <style>
        <!-- #myrect {
        stroke: blue;
        stroke-width: 2;
        fill: none
        }
        -->
      </style>
    </defs>

    <!-- <rect x="10" y="20" width="30" height="30" stroke="black" stroke-width="5" fill="transparent"></rect> -->
    <rect x="10" y="20" width="30" height="30" id="myrect"></rect>
  </svg>

  <svg width="100" height="100" viewBox="50 50 50 50">

    <rect x="60" y="60" width="50px" height="50px" />
  </svg>
  <svg width="300" height="100">
    <defs></defs>
    <g id="myCircle">
      <text x="25" y="20">圆形</text>
      <circle cx="50" cy="50" r="20" />
    </g>

    <use href="#myCircle" x="100" y="0" fill="blue" />
    <use href="#myCircle" x="200" y="0" fill="white" stroke="blue" />
  </svg>
  <svg width="300" height="300">
    <defs>
      <pattern id="dots" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <circle fill="#bee9e8" cx="50" cy="50" r="35" />
      </pattern>
    </defs>
    <rect x="0" y="0" width="100%" height="100%" fill="url(#dots)" />
  </svg>

  <svg width="500px" height="500px">
    <rect x="0" y="0" width="100" height="100" fill="#feac5e">
      <!-- <animate attributeName="x" from="0" to="500" dur="4s" repeatCount="indefinite" /> -->
      <animate attributeName="x" from="0" to="500" dur="2s" repeatCount="indefinite" />
      <animate attributeName="width" to="500" dur="2s" repeatCount="indefinite" />
    </rect>
  </svg>
  <svg width="500px" height="500px">
    <rect x="250" y="250" width="50" height="50" fill="#4bc0c8">
      <animateTransform attributeName="transform" type="rotate" begin="0s" dur="10s" from="0 200 200" to="360 400 400"
        repeatCount="indefinite" />
    </rect>
  </svg>

  <svg width="350" height="160">
    <g class="layer" transform="translate(60,10)">
      <circle r="2" cx="0" cy="105" />
      <circle r="2" cx="90" cy="90" />
      <circle r="2" cx="180" cy="60" />
      <circle r="2" cx="270" cy="0" />

      <polyline points="0,105 90,90 180,60 270,0" fill="none" stroke="red" />

      <g class="y axis">
        <line x1="0" y1="0" x2="0" y2="120" style="stroke:black;stroke-width:1" />
        <text x="-40" y="115" dx="-10" dy="5">$10</text>
        <text x="-40" y="5" dy="5">$80</text>
      </g>
      <g class="x axis" transform="translate(0, 122)">
        <line x1="0" y1="0" x2="270" y2="0" style="stroke:black;stroke-width:1" />
        <text x="-10" y="20">Jan.</text>
        <text x="255" y="20">Apr.</text>
      </g>
    </g>
  </svg>
</body>
<script>
  var svgString = new XMLSerializer()
    .serializeToString(document.querySelector('svg'));
  console.log(svgString);
</script>

</html>
