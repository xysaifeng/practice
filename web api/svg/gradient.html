  <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
      <linearGradient id="Gradient">
        <stop offset="0" stop-color="white" stop-opacity="0.2" />
        <stop offset=".9" stop-color="white" stop-opacity="1" />
      </linearGradient>
      <mask id="Mask">
        <rect x="0" y="0" width="200" height="200" fill="url(#Gradient)" />
      </mask>
    </defs>

    <!-- <rect x="0" y="0" width="200" height="200" fill="green" /> -->
    <rect x="0" y="0" width="200" height="200" fill="red" mask="url(#Mask)" />
  </svg>
  <svg width="200" height="200" version="1.1" xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <rect x="0" y="0" width="200" height="200" fill="blue" />
    <circle cx="100" cy="100" r="50" stroke="yellow" stroke-width="40" stroke-opacity=".7" fill="red" />
  </svg>
  <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200"
    height="200">

    <!--  transform="rotate(45)" -->
    <!-- x="90" y="-65" -->

      href="https://developer.mozilla.org/zh-CN/docs/Web/SVG/Element/image/mdn_logo_only_color.png" />
  </svg>
  <svg viewBox="-10 -10 120 120">
    <mask id="myMask">
      <!-- 白色像素下的所有内容都将可见 -->
      <rect x="0" y="0" width="100" height="100" fill="#fff" />

      <!-- 黑色像素下的所有内容都将不可见 -->
      <path d="M10,35 A20,20,0,0,1,50,35 A20,20,0,0,1,90,35 Q90,65,50,95 Q10,65,10,35 Z" fill="black" />
    </mask>

    <polygon points="-10,110 110,110 110,-10" fill="orange" />

    <!-- 应用此蒙版后，我们在圆圈中“打”一个心形孔 -->
    <circle cx="50" cy="50" r="50" mask="url(#myMask)" />
  </svg>
