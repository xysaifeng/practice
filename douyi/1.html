    async function watiClick() {
      const el = document.getElementById('btn')
      const observer = el.when('click')
      let i = 0
      async function clicked() {
        return new Promise(resolve => {
          i++
          observer.subscribe(resolve)
        })
      }
      while (true) {
        await clicked()
        console.log('点击次数', i);
        console.log('clicked')
      }
    }

    EventTarget.addEventListener

    function handleClick3() {
      const stopSignal = new EventTarget();
      let i = 0
      document.when('click')
        .takeUntil(stopSignal.when('stop'))
        .map((e, t) => {
          console.log('点击次数: ', t);
          return { dx: e.clientX, dy: e.clientY }
        })
        .subscribe(e => {
          i++
          console.log('i', i);
          if (i === 3) {
            console.log('停止订阅');
            stopSignal.dispatchEvent(new Event('stop'));
          }
          console.log(e);
        })
    }

    async function handleClick2() {
      let times = 0
      console.log(document.getElementById('list').when('click'));
      const el = document.getElementById('list');
      const r = await el.when('click')
        .filter((event, t) => {
          console.log('t: ', t);
          times = t
          return event.target.tagName === 'LI'
        })
        .take(4)
        .forEach((event, t) => {
          console.log('点击次数：', t, event.target.textContent);
          // 这里可以执行副作用操作，如修改UI
          event.target.style.backgroundColor = 'lightblue';
          // 3秒后恢复颜色
          setTimeout(() => {
            event.target.style.backgroundColor = '';
          }, 2000);
          return t // 无效返回，但为了演示，保留
        }).then(res => {
          console.log(res, '--res');
          return times
        })
      console.log('总共点击次数：', r);

    function handleInput() {
      const ob = input.when('input');
      console.log('ob: ', ob);
      ob.map(event => event.target.value)
        .inspect(rawValue => console.log('原始输入:', rawValue))
        .filter(value => value.length > 1)
        .inspect(filteredValue => console.log('过滤后输入:', filteredValue))
        .switchMap(searchTerm => fetch(`https://jsonplaceholder.typicode.com/posts/${searchTerm}`))
        .inspect(response => console.log('API响应:', response.status))
        .switchMap(response => response.json())
        .inspect(data => {
          console.log('解析后的数据:', data);
        })
        .subscribe(results => {
          console.log('最终结果:', results);
        });
    }
