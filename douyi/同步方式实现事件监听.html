    function getElement(id) {
      const btn = document.getElementById(id)

      // 不行 点击后就不变了resolved 状态
      // btn.waitClick = new Promise((resolve) => {
      //   btn.onclick = resolve
      // })

      const proxy = new Proxy(btn, {
        get(target, key) {
          if (!key.startsWith('wait')) {
            return Reflect.get(target, key)
          }
          return target[key] = new Promise((resolve) => {
            const ename = key.slice(4).toLowerCase()
            console.log('ename: ', ename);
            target.addEventListener(ename, resolve, {
              once: true // 最好设为true 因为点击是一次性的
            })
          })
        }
      })
      // return btn
      return proxy
    }
    async function handleClick() {

        if (i > 4) {

        }
      }
    }

      while (2) {

    }

    // take takeUntil drop
    function handleClick5() {
      // 创建一个用于通知停止的信号
      const stopSignal = new EventTarget();
      const ob = btn.when('click');
      let i = 0
      console.log('click: ', ob);
      // 使用 take(n) 限制事件次数
      ob.take(5) // 仅处理前5个点击事件
        .drop(1) // 跳过第一个点击事件
        .takeUntil(stopSignal.when('stop')) // 当 stopSignal 发出 stop 事件时结束
        .subscribe({
          next(e) {
            console.log(e);
          }
        })
      // .subscribe(e => {
      //   i++

      //     // 当需要停止监听时

      //   console.log(i);
      // });
    }

    // switchMap
    function handleClick8() {
      const stopSignal = new EventTarget();
      const ob = ipt.when('input');
      console.log('ob: ', ob);
      ob.takeUntil(stopSignal.when('stop')).switchMap(event => {
        const val = event.target.value;

        return fetch(`https://jsonplaceholder.typicode.com/posts/${val}`)
          .then(response => {
            if (response.status !== 200) {
              // throw new Error('请求失败')
              // return Promise.reject(('请求失败2')) // error回调捕捉
              return Promise.resolve({ code: 1002, status: response.status, data: null, msg: '请求失败' })// next回调捕捉
            }
            return response.json()
          })
        // .catch(err => {
        //   console.log('err:1 ', err);
        //   return Promise.resolve({ code: 1001, data: null, msg: err })
        // })

      })
        .catch(err => {
          console.log('err: s', err);
          stopSignal.dispatchEvent(new Event('stop'));
          // return { fallback: 'error data' }
        })
        .finally((s) => {
          console.log(s, 'finally');

        })
        // .subscribe(value => console.log('防抖后的输入:', value)); 这种方式错误捕捉不了
        .subscribe({
          next(value) {
            console.log('value: ', value);
          },
          error(err) { // 错误回调
            console.log('err: ', err);
          },
        });
    }

    // 测试reduce 结合take
    async function handleClick11() {
      const ob = document.body.when('click');

    // flatMap
    function handleClick16() {
      let start = 0

      const ob = document.when('click')
      console.log('ob: ', ob);
      ob.take(5) // 取5次点击
        .inspect(event => {
          start = performance.now()
        })
        .flatMap((event, t) => {
          console.log('t: ', t);
          // 为每次点击创建一个处理流程
          const clickData = {
            type: 'click',
            position: { x: event.clientX, y: event.clientY },
            timestamp: Date.now()
          };

          // 返回一个Promise（会被自动转换为Observable）
          return Promise.all([
            fetch('https://jsonplaceholder.typicode.com/posts/1').then(response => response.json()),
            fetch('https://jsonplaceholder.typicode.com/posts/3').then(response => response.json()),
            fetch('https://jsonplaceholder.typicode.com/posts/2').then(response => response.json())
          ]);
        })
        .inspect(result => {
          if (start) {
            console.log('处理耗时:', performance.now() - start);
            start = 0
          }
        })
        .subscribe(result => {
          console.log('点击跟踪结果:', result);
        });
    }

    async function handleClick17() {
      const el = document.getElementById('list');
      const r = await el.when('click')
        .filter(event => event.target.tagName === 'LI')
        .take(3)
        .forEach((event, index) => {
          console.log(`第 ${index + 1} 次按钮点击:`, event.target.textContent);
          // 这里可以执行副作用操作，如修改UI
          event.target.style.backgroundColor = 'lightblue';

          // 3秒后恢复颜色
          setTimeout(() => {
            event.target.style.backgroundColor = '';
          }, 3000);
          if (index === 2) {
            throw new Error('结束')
          }
          return index
        }).then(r => {
          console.log(r, '2--res');
          return 2333
        }).catch(r => {

          return 2444
        }).finally(() => {
          console.log('--finally');
        }).then(r => {
          console.log(r, '--res2');
          return 2555
        })
      console.log(r, '--res'); // 2333
    }
